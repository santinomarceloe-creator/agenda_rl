<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar y exportar | Agenda</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f4f8;color:#222}header{background:#5b36a8;color:white;padding:24px}header h1{margin:0 0 6px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:#fff;box-shadow:0 2px 8px #0001}nav a{color:#56329d;text-decoration:none;padding:8px 10px;border-radius:8px;background:#f0ebfa;font-size:14px}main{max-width:1000px;margin:28px auto;padding:0 18px}.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 4px 18px #0000000c}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;margin:5px 3px}textarea{display:block;width:min(100%,600px);min-height:80px}button{background:#5b36a8;color:white;border:0;cursor:pointer}article{background:#f8f6fc;border-left:4px solid #7a55c4;padding:12px 15px;margin:12px 0;border-radius:8px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#faf9fd;min-height:90px;padding:8px;border:1px solid #e5e0ef;border-radius:7px}.day small{display:block;background:#e9e1f8;padding:4px;margin-top:5px;border-radius:4px;overflow-wrap:anywhere}.head{min-height:auto;text-align:center;font-weight:bold;background:#eee8f8}.empty{background:transparent;border:0}.dark{background:#17151d;color:#eee}.dark .panel,.dark nav{background:#24202d}.dark article,.dark .day{background:#302a3a;color:#eee}.dark nav a{background:#403452;color:#fff}
</style></head><body><header><h1>Agenda — Importar y exportar</h1><div>Hacer copias de seguridad de tus eventos</div></header><nav><a href="01_calendario.html">1. Calendario</a><a href="02_eventos.html">2. Eventos</a><a href="03_categorias.html">3. Categorías</a><a href="04_recordatorios.html">4. Recordatorios</a><a href="05_tareas.html">5. Tareas</a><a href="06_notas.html">6. Notas</a><a href="07_busqueda_filtros.html">7. Búsqueda y filtros</a><a href="08_eventos_compartidos.html">8. Eventos compartidos</a><a href="09_importar_exportar.html">9. Importar y exportar</a><a href="10_configuracion.html">10. Configuración</a></nav><main><section class="panel">
<button onclick="exportar()">Exportar eventos a JSON</button><p><label>Importar archivo JSON: <input id="archivo" type="file" accept=".json,application/json"></label></p><button onclick="importar()">Importar</button><p id="estado"></p>
<script>
function exportar(){let data=localStorage.getItem('agenda_eventos')||'[]',blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eventos.json';a.click();URL.revokeObjectURL(a.href)}async function importar(){let f=archivo.files[0];if(!f){estado.textContent='Seleccioná un archivo.';return}try{let a=JSON.parse(await f.text());if(!Array.isArray(a))throw Error();localStorage.setItem('agenda_eventos',JSON.stringify(a));estado.textContent='Eventos importados correctamente.'}catch(e){estado.textContent='El archivo JSON no tiene un formato válido.'}}
</script></section></main></body></html>
